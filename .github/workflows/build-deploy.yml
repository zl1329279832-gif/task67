# CI/CD — Build Vue Admin + WAR, deploy to Tomcat
# Produces: ssmu8xr0.war  (context path /ssmu8xr0)

name: Build & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  JAVA_VERSION: '8'          # switch to '11' when ready
  NODE_VERSION: '16'
  MAVEN_PROFILE: mysql        # or sqlserver

jobs:
  # ── 1. Build Vue Admin ──────────────────────────────────────
  build-vue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssmu8xr0/src/main/webapp/admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ssmu8xr0/src/main/webapp/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-admin-dist
          path: ssmu8xr0/src/main/webapp/admin/dist/
          retention-days: 3

  # ── 2. Build WAR ────────────────────────────────────────────
  build-war:
    runs-on: ubuntu-latest
    needs: build-vue
    defaults:
      run:
        working-directory: ssmu8xr0
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download Vue dist
        uses: actions/download-artifact@v4
        with:
          name: vue-admin-dist
          path: ssmu8xr0/src/main/webapp/admin/dist/

      - name: Maven package
        run: mvn clean package -P ${{ env.MAVEN_PROFILE }} -DskipTests -B

      - name: Verify WAR
        run: |
          ls -lh target/ssmu8xr0.war
          echo "--- WAR contents (admin/) ---"
          jar tf target/ssmu8xr0.war | grep '^admin/' | head -30

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssmu8xr0-war
          path: ssmu8xr0/target/ssmu8xr0.war
          retention-days: 7

  # ── 3. Deploy to Tomcat (manual trigger or push to master) ──
  deploy:
    runs-on: ubuntu-latest
    needs: build-war
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: ssmu8xr0-war

      - name: Deploy to Tomcat via SSH
        # Configure these secrets in repo Settings > Secrets:
        #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY, TOMCAT_WEBAPPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TOMCAT_WEBAPPS: ${{ secrets.TOMCAT_WEBAPPS || '/opt/tomcat/webapps' }}
        run: |
          echo "TODO: configure deployment secrets, then uncomment below"
          # mkdir -p ~/.ssh
          # echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          # chmod 600 ~/.ssh/id_rsa
          # ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          # scp ssmu8xr0.war ${DEPLOY_USER}@${DEPLOY_HOST}:${TOMCAT_WEBAPPS}/ssmu8xr0.war
          # ssh ${DEPLOY_USER}@${DEPLOY_HOST} "sudo systemctl restart tomcat"
          echo "WAR is ready for manual deployment: ssmu8xr0.war"
