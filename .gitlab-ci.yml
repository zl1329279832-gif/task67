# ============================================================
# 白云会议管理系统 - GitLab CI/CD 流水线
# 构建产出: ssmu8xr0.war (SSM + Vue Admin)
# ============================================================

stages:
  - build-frontend
  - build-backend
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - ssmu8xr0/.m2/repository/
    - ssmu8xr0/src/main/webapp/admin/node_modules/

# ============================================================
# Stage 1: 构建 Vue Admin 前端
# ============================================================
build-frontend:
  stage: build-frontend
  image: node:14
  script:
    - cd ssmu8xr0/src/main/webapp/admin
    - npm install --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - ssmu8xr0/src/main/webapp/admin/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================
# Stage 2: Maven 构建 WAR (MySQL)
# ============================================================
build-backend-mysql:
  stage: build-backend
  image: maven:3.8-openjdk-8
  needs:
    - build-frontend
  script:
    - cd ssmu8xr0
    - mvn clean package -Pmysql -Dskip.frontend=true -DskipTests -B
  artifacts:
    paths:
      - ssmu8xr0/target/ssmu8xr0.war
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================
# Stage 2b: Maven 构建 WAR (SQL Server) — 手动触发
# ============================================================
build-backend-sqlserver:
  stage: build-backend
  image: maven:3.8-openjdk-8
  needs:
    - build-frontend
  script:
    - cd ssmu8xr0
    - mvn clean package -Psqlserver -Dskip.frontend=true -DskipTests -B
  artifacts:
    paths:
      - ssmu8xr0/target/ssmu8xr0.war
    expire_in: 1 week
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================
# Stage 3: 部署到 Tomcat 测试实例 — 手动触发
# 需要在 GitLab CI/CD Variables 中设置:
#   TOMCAT_MANAGER_URL  — Tomcat Manager 地址 (如 http://tomcat:8080/manager)
#   TOMCAT_USER         — Tomcat Manager 用户名
#   TOMCAT_PASSWORD     — Tomcat Manager 密码
#   DEPLOY_URL          — 部署后的访问地址
# ============================================================
deploy-staging:
  stage: deploy
  image: alpine:latest
  needs:
    - build-backend-mysql
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -u "${TOMCAT_USER}:${TOMCAT_PASSWORD}" \
        -F "file=@ssmu8xr0/target/ssmu8xr0.war" \
        "${TOMCAT_MANAGER_URL}/text/deploy?path=/ssmu8xr0&update=true"
    - echo "部署完成: ${DEPLOY_URL:-http://your-server/ssmu8xr0}"
  environment:
    name: staging
    url: ${DEPLOY_URL}
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
